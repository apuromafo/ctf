<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Echo Pwn Maze - Standalone Edition</title>
    <style>
        :root { --thm-green: #a2ff00; --thm-dark: #05070a; --panel: #0d1117; }
        body { 
            background: var(--thm-dark); color: var(--thm-green); 
            font-family: 'Ubuntu Mono', monospace; margin: 0; 
            display: flex; flex-direction: column; height: 100vh; overflow: hidden;
        }

        #top-bar {
            height: 60px; background: var(--panel); border-bottom: 2px solid #232a3b;
            display: flex; justify-content: space-between; align-items: center; padding: 0 25px;
        }

        #main-layout {
            display: grid; grid-template-columns: 300px 1fr 300px;
            flex-grow: 1; height: calc(100vh - 60px);
        }

        .sidebar {
            background: var(--panel); border-right: 1px solid #232a3b;
            display: flex; flex-direction: column; padding: 15px;
        }

        #log-container, #ranking-list {
            flex-grow: 1; background: #000; border: 1px solid #1a1a1a;
            padding: 10px; font-size: 11px; overflow-y: auto; color: #4e7a00;
        }

        #viewport { display: flex; justify-content: center; align-items: center; background: #000; }
        #game-container { position: relative; width: 450px; height: 450px; border: 2px solid var(--thm-green); }

        .grid { display: grid; grid-template-columns: repeat(15, 1fr); width: 100%; height: 100%; position: absolute; }
        .cell { display: flex; align-items: center; justify-content: center; font-size: 11px; }
        .wall { color: var(--thm-green); background: #080a05; font-weight: bold; text-shadow: 0 0 5px var(--thm-green); }
        .path { color: #111; background: #000; }

        .entity { position: absolute; width: 30px; height: 30px; display: flex; align-items: center; justify-content: center; z-index: 20; }
        .entity img { width: 85%; height: 85%; }
        .immune { filter: drop-shadow(0 0 10px #fff) brightness(1.5); transform: scale(1.1); z-index: 30; }
        .rank-item { padding: 6px; border-bottom: 1px solid #1a1a1a; color: #fff; }
    </style>
</head>
<body>

<div id="top-bar">
    <div id="timer-ui" style="font-size: 26px;">00:00:00</div>
    <div>NODE: <span id="lvl-ui">--</span> | STATUS: <span id="status-ui">NORMAL</span></div>
    <div style="font-size: 10px; opacity: 0.5;">JS_ENGINE_LOCAL</div>
</div>

<div id="main-layout">
    <div class="sidebar">
        <div style="margin-bottom: 8px;">[ CONSOLE_LOG ]</div>
        <div id="log-container"></div>
    </div>

    <div id="viewport">
        <div id="game-container">
            <div id="grid" class="grid"></div>
            <div id="echo-player" class="entity"><img src="personaje/img_echo.svg"></div>
            <div id="exit-node" class="entity"><img src="personaje/paredfinal_cuadrado.svg"></div>
            <div id="firewall" class="entity"><img src="personaje/villano_triangulo.svg"></div>
            <div id="star" class="entity"><img src="personaje/estrella.svg"></div>
        </div>
    </div>

    <div class="sidebar" style="border-right:0; border-left:1px solid #232a3b;">
        <div style="margin-bottom: 8px;">[ TOP_RANKING_B64 ]</div>
        <div id="ranking-list"></div>
    </div>
</div>

<script>
    let currentMaze = [], pPos = {x:1, y:1}, ePos = {x:-1, y:-1}, sPos = {x:-1, y:-1}, exitPos = {x:13, y:13};
    let currentLvl = 1, isImmune = false, startTime = Date.now(), isSubmitting = false, enemyTick = 0;

    // B64 seguro UTF-8 (btoa/atob nativos rompen con tildes/ñ/emoji)
    function b64encodeUtf8(str) {
        return btoa(String.fromCharCode(...new TextEncoder().encode(str)));
    }
    function b64decodeUtf8(b64) {
        const bytes = Uint8Array.from(atob(b64), c => c.charCodeAt(0));
        return new TextDecoder().decode(bytes);
    }

    // MATRIX EFFECT: Los ceros y unos cambian de color y valor
    setInterval(() => {
        document.querySelectorAll('.wall').forEach(c => {
            if(Math.random() > 0.9) {
                c.textContent = Math.random() > 0.5 ? "1" : "0";
                c.style.color = Math.random() > 0.5 ? "#a2ff00" : "#4e7a00";
            }
        });
    }, 120);

    // CRONÓMETRO
    setInterval(() => {
        let diff = new Date(Date.now() - startTime);
        document.getElementById('timer-ui').textContent = diff.toISOString().substr(14, 8);
    }, 100);

    // CARGAR NIVEL (Desde JSON local)
    async function loadLevel(num) {
        try {
            const res = await fetch(`json/nivel${num}.json`);
            const data = await res.json();
            currentMaze = data.maze;
            pPos = {x: data.spawn[0], y: data.spawn[1]};
            ePos = {x: data.enemy_spawn[0], y: data.enemy_spawn[1]};
            sPos = {x: data.star[0], y: data.star[1]};
            exitPos = {x: data.exit[0], y: data.exit[1]};
            
            document.getElementById('lvl-ui').textContent = num.toString().padStart(2, '0');
            enemyTick = 0;
            sanitizeLevel();
            renderGrid();
            updatePos();
            updateRankingUI(); 
            addLog(`Sector ${num} cargado correctamente.`);
        } catch(e) { addLog("ERROR: No se pudo cargar el JSON."); }
    }

    // FAILSAFE: corrige mapas viejos con spawn/enemigo dentro del muro
    function sanitizeLevel() {
        const carve = (pos) => {
            if (pos && pos.x >= 0 && pos.y >= 0 && currentMaze[pos.y] && currentMaze[pos.y][pos.x] === 1) {
                currentMaze[pos.y][pos.x] = 0;
            }
        };
        carve(pPos); carve(sPos); carve(exitPos);
        // Si el enemigo spawnea en muro o fuera de alcance, reubicarlo al path libre más cercano
        if (ePos.x === -1) return;
        const blocked = !currentMaze[ePos.y] || currentMaze[ePos.y][ePos.x] !== 0;
        if (blocked) {
            const seen = new Set([ePos.x + ',' + ePos.y]);
            const q = [{x: ePos.x, y: ePos.y}];
            let found = null;
            while (q.length && !found) {
                const c = q.shift();
                if (c.x >= 0 && c.y >= 0 && c.x < 15 && c.y < 15 && currentMaze[c.y] && currentMaze[c.y][c.x] === 0) {
                    // exigir que tenga al menos un vecino libre (no celda aislada)
                    found = c; break;
                }
                [[1,0],[-1,0],[0,1],[0,-1]].forEach(([dx,dy]) => {
                    const nx = c.x + dx, ny = c.y + dy, k = nx + ',' + ny;
                    if (nx >= 0 && ny >= 0 && nx < 15 && ny < 15 && !seen.has(k)) { seen.add(k); q.push({x: nx, y: ny}); }
                });
            }
            if (found) { ePos = found; addLog("Firewall reubicado a ruta válida."); }
            else { ePos = {x:-1, y:-1}; addLog("Firewall sin ruta: desactivado."); }
        }
    }

    function renderGrid() {
        const g = document.getElementById('grid'); g.innerHTML = '';
        currentMaze.forEach(row => row.forEach(v => {
            const c = document.createElement('div');
            const isWall = v === 1;
            c.className = `cell ${isWall ? 'wall' : 'path'}`;
            c.textContent = isWall ? v : '';
            g.appendChild(c);
        }));
    }

    function updatePos() {
        const draw = (id, pos) => {
            const el = document.getElementById(id);
            if(pos.x === -1) el.style.display = 'none';
            else { el.style.display = 'flex'; el.style.left = (pos.x * 30) + 'px'; el.style.top = (pos.y * 30) + 'px'; }
        };
        draw('echo-player', pPos); draw('exit-node', exitPos); draw('firewall', ePos); draw('star', sPos);
    }

    function handleInput(dx, dy) {
        if (!currentMaze.length) return;
        let nx = pPos.x + dx, ny = pPos.y + dy;
        if(ny >= 0 && ny < 15 && nx >= 0 && nx < 15) {
            if(currentMaze[ny][nx] === 0 || isImmune) {
                pPos.x = nx; pPos.y = ny;
                checkCollisions();
                // El firewall avanza 1 celda cada 2 pasos del jugador:
                // a igual velocidad en pasillos de 1 celda era imposible esquivarlo.
                if(ePos.x !== -1) { enemyTick++; if(enemyTick % 2 === 0) moveEnemy(); }
                updatePos();
            } else { addLog("Bloqueo físico detectado."); }
        }
    }

    function moveEnemy() {
        // Persecución en 4 direcciones, sin atravesar muros en diagonal
        const options = [[1,0],[-1,0],[0,1],[0,-1]];
        const dist = (x, y) => Math.abs(pPos.x - x) + Math.abs(pPos.y - y);
        let best = null, bestD = dist(ePos.x, ePos.y);
        for (const [dx, dy] of options) {
            const nx = ePos.x + dx, ny = ePos.y + dy;
            if (nx < 0 || ny < 0 || nx >= 15 || ny >= 15) continue;
            if (!currentMaze[ny] || currentMaze[ny][nx] !== 0) continue;
            const d = dist(nx, ny);
            if (d < bestD) { bestD = d; best = {x: nx, y: ny}; }
        }
        if (best) { ePos = best; }
        if (pPos.x === ePos.x && pPos.y === ePos.y && !isImmune) {
            addLog("FIREWALL: Reiniciando nodo.");
            loadLevel(currentLvl);
        }
    }

    function checkCollisions() {
        if(pPos.x === sPos.x && pPos.y === sPos.y) {
            sPos = {x:-1, y:-1}; isImmune = true;
            addLog("OVERDRIVE activado (8s).");
            document.getElementById('echo-player').classList.add('immune');
            document.getElementById('status-ui').textContent = "OVERDRIVE";
            setTimeout(() => { 
                isImmune = false; 
                document.getElementById('echo-player').classList.remove('immune');
                document.getElementById('status-ui').textContent = "NORMAL";
            }, 8000);
        }
        if(pPos.x === ePos.x && pPos.y === ePos.y && !isImmune) {
            addLog("FIREWALL: Reiniciando nodo.");
            loadLevel(currentLvl);
        }
        if(pPos.x === exitPos.x && pPos.y === exitPos.y) {
            if(currentLvl < 10) { currentLvl++; loadLevel(currentLvl); }
            else winGame();
        }
    }

    function addLog(msg) {
        const box = document.getElementById('log-container');
        const d = document.createElement('div');
        d.innerHTML = `<span style="color:#222;">></span> ${msg}`;
        box.prepend(d);
        if(box.childNodes.length > 30) box.removeChild(box.lastChild);
    }

    // PERSISTENCIA LOCAL (Simula scores.db usando LocalStorage)
    function saveScoreLocal(user) {
        try {
            let scores = JSON.parse(localStorage.getItem('pwn_scores') || "[]");
            let entry = `USER: ${user} | LVL: ${currentLvl} | TIME: ${document.getElementById('timer-ui').textContent}`;
            // Lo guardamos codificado en B64 como pediste (UTF-8 safe)
            scores.push(b64encodeUtf8(entry));
            localStorage.setItem('pwn_scores', JSON.stringify(scores));
        } catch(e) { addLog("ERROR: no se pudo guardar local."); }
        updateRankingUI();
    }

    async function updateRankingUI() {
        const list = document.getElementById('ranking-list');
        list.innerHTML = '';
        let scores = [];
        // 1) Ranking del servidor (scores.db) si estamos bajo Juego.py
        try {
            const res = await fetch('/api/ranking');
            if (res.ok) {
                const data = await res.json();
                if (Array.isArray(data.scores)) scores = scores.concat(data.scores);
            }
        } catch(e) { /* modo standalone: solo local */ }
        // 2) Ranking local
        try {
            scores = scores.concat(JSON.parse(localStorage.getItem('pwn_scores') || "[]"));
        } catch(e) { /* localStorage corrupto: ignorar */ }
        [...scores].reverse().forEach(b64 => {
            let div = document.createElement('div');
            div.className = 'rank-item';
            try { div.textContent = b64decodeUtf8(b64); }
            catch(e) { div.textContent = "[score corrupto]"; }
            list.appendChild(div);
        });
    }

    async function winGame() {
        if(isSubmitting) return;
        isSubmitting = true;
        let alias = prompt("SISTEMA COMPROMETIDO. Alias para el ranking:");
        if(!alias) { isSubmitting = false; return; }
        alias = alias.trim().slice(0, 32) || "anon";
        // Intento servidor (CSRF de un solo uso) + fallback local
        try {
            const tRes = await fetch('/get_token');
            if (tRes.ok) {
                const {csrf_token} = await tRes.json();
                const sRes = await fetch('/save_ranking', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({user: alias, lvl: currentLvl, csrf_token})
                });
                if (sRes.ok) addLog("Ranking guardado en servidor.");
                else { addLog("Servidor rechazó score, guardo local."); saveScoreLocal(alias); }
            } else { saveScoreLocal(alias); addLog("Datos inyectados localmente."); }
        } catch(e) { saveScoreLocal(alias); addLog("Sin servidor: datos locales."); }
        updateRankingUI();
        setTimeout(() => location.reload(), 1500);
    }

    window.onkeydown = (e) => {
        if(["ArrowUp","ArrowDown","ArrowLeft","ArrowRight"," "].includes(e.key)) e.preventDefault();
        if(e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') handleInput(0,-1);
        if(e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') handleInput(0,1);
        if(e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') handleInput(-1,0);
        if(e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') handleInput(1,0);
    };

    loadLevel(1);
</script>
</body>
</html>
